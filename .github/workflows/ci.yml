name: CI & Lint

on:
  pull_request:
    branches:
      - main

jobs:
  changes:
    name: Detect affected components
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            code:
              - 'cmd/**'
              - 'config/**'
              - 'database/**'
              - 'handlers/**'
              - 'integration/**'
              - 'logging/**'
              - 'middleware/**'
              - 'models/**'
              - 'pb_migrations/**'
              - 'router/**'
              - 'templates/**'
              - 'tests/**'
              - 'types/**'
              - 'utils/**'
              - 'worker/**'
              - 'go.mod'
              - 'go.sum'
              - 'run-demo.sh'
              - 'Dockerfile'
              - 'docker/**'
              - '.githooks/**'
              - '.github/workflows/ci.yml'
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: '**/go.sum'

      - name: Run build
        run: go build -o auth-proxy-server ./cmd/server && go build -o admin-cli ./cmd/admin-cli

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: '**/go.sum'

      - name: Check formatting
        run: |
          gofmt_output=$(gofmt -l .)
          if [ -n "$gofmt_output" ]; then
            echo "The following files are not formatted correctly:"
            echo "$gofmt_output"
            exit 1
          fi
          echo "All files are correctly formatted."

      - name: Cache golangci-lint
        uses: actions/cache@v6
        with:
          path: ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-lint-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-golangci-lint-

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          skip-cache: true

  authentication:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Authentication and browser tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: Install PocketBase and browser dependencies
        run: |
          curl -fsSL --retry 3 https://github.com/pocketbase/pocketbase/releases/download/v0.36.9/pocketbase_0.36.9_linux_amd64.zip -o "$RUNNER_TEMP/pocketbase.zip"
          unzip -q "$RUNNER_TEMP/pocketbase.zip" -d "$RUNNER_TEMP/pocketbase"
          sudo apt-get update
          sudo apt-get install -y php8.3-fpm
          python3 -m venv "$RUNNER_TEMP/passkey-venv"
          "$RUNNER_TEMP/passkey-venv/bin/pip" install playwright==1.64.0
          "$RUNNER_TEMP/passkey-venv/bin/playwright" install --with-deps chromium
      - name: Test Go authentication with PocketBase and race detection
        run: PB_BINARY="$RUNNER_TEMP/pocketbase/pocketbase" go test -race ./...
      - name: Test JS and PHP passkeys with a virtual authenticator
        env:
          PHP_FPM_BINARY: /usr/sbin/php-fpm8.3
        run: PB_BINARY="$RUNNER_TEMP/pocketbase/pocketbase" "$RUNNER_TEMP/passkey-venv/bin/python" tests/passkeys_e2e.py
