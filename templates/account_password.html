<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="stylesheet" href="{{.Paths.Assets}}/css/style.css">
    <link rel="stylesheet" href="{{.Paths.Assets}}/css/account.css">
</head>
<body>
    <div class="container content-container">
        <h2>Change Password</h2>
        <form id="change-password-form" action="{{.Paths.AccountPassword}}" method="post">
            <input type="hidden" name="gorilla.csrf.Token" value="{{.CSRFToken}}">
            <div class="form-group">
                <label for="current_password">Current Password</label>
                <input type="password" id="current_password" name="current_password" required>
            </div>
            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" required>
            </div>
            <div class="form-group">
                <label for="confirm_new_password">Confirm New Password</label>
                <input type="password" id="confirm_new_password" name="confirm_new_password" required>
            </div>
            <button type="submit">Update Password</button>
        </form>
        <p id="message-placeholder" class="message"></p>
        <div class="back-link">
            <a href="{{.Paths.Account}}">Back to Account</a>
        </div>
    </div>
    <script src="{{.Paths.Assets}}/js/auth.js"></script>
</body>
</html>
