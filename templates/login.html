<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{.Paths.Assets}}/css/style.css">
</head>
<body>
    <div class="container form-container">
        <h2>Login Required</h2>
        <form id="login-form" action="{{.Paths.Login}}" method="post">
            <input type="hidden" name="xsrf_token" value="{{ .XSRFToken }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username webauthn" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <section id="passkey-signin" hidden aria-label="Passkey sign in">
            <p class="passkey-divider">or</p>
            <button type="button" id="passkey-login">Sign in with a passkey</button>
            <p class="passkey-details">Use your fingerprint, face or PIN.</p>
        </section>
        <p id="passkey-status" class="message" role="status" aria-live="polite"></p>
        <p class="error">
            {{if .Error}}
                {{.Error}}
            {{end}}
        </p>
        <div style="text-align: center; margin-top: 1rem;">
            {{if .RegisterEnabled}}
            <a href="{{.Paths.Register}}">Don't have an account? Register</a>
            {{end}}
        </div>
    </div>
    <script src="{{.Paths.Assets}}/js/auth.js"></script>
    <script src="{{.Paths.Assets}}/js/passkeys.js" defer></script>
</body>
</html>
